apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matchmaker
  template:
    metadata:
      labels:
        app: matchmaker
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379 && nc -z nats 4222; do sleep 1; done']
      containers:
        - name: matchmaker
          image: kung-fu-chess-matchmaker:latest
          imagePullPolicy: Never
          env:
            - name: REDIS_HOST
              value: redis
            - name: NATS_URL
              value: nats://nats:4222
          ports:
            - containerPort: 8003
---
apiVersion: v1
kind: Service
metadata:
  name: matchmaker
spec:
  selector:
    app: matchmaker
  ports:
    - port: 8003
      targetPort: 8003
