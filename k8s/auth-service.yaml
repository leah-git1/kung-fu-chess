apiVersion: v1
kind: Secret
metadata:
  name: auth-secret
stringData:
  DATABASE_URL: postgresql://kfc:kfc@postgres:5432/kfc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do sleep 1; done']
      containers:
        - name: auth-service
          image: kfc-backend:latest
          imagePullPolicy: Never
          command:
            - uvicorn
            - services.backend.auth.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: DATABASE_URL
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
