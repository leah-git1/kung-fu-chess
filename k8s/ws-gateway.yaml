apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ws-gateway
  template:
    metadata:
      labels:
        app: ws-gateway
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379 && nc -z nats 4222 && nc -z matchmaker 8003 && nc -z game-allocator 8004; do sleep 1; done']
      containers:
        - name: ws-gateway
          image: kung-fu-chess-ws-gateway:latest
          imagePullPolicy: Never
          env:
            - name: REDIS_HOST
              value: redis
            - name: NATS_URL
              value: nats://nats:4222
            - name: MM_HOST
              value: matchmaker
            - name: MM_PORT
              value: "8003"
            - name: ROOMS_HOST
              value: rooms-api
            - name: ROOMS_PORT
              value: "8001"
            - name: ALLOCATOR_HOST
              value: game-allocator
            - name: ALLOCATOR_PORT
              value: "8004"
            - name: WS_PORT
              value: "5555"
          ports:
            - containerPort: 5555
---
apiVersion: v1
kind: Service
metadata:
  name: ws-gateway
spec:
  type: NodePort
  selector:
    app: ws-gateway
  ports:
    - port: 5555
      targetPort: 5555
      nodePort: 30555
