apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-shard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-shard
  template:
    metadata:
      labels:
        app: game-shard
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do sleep 1; done']
      containers:
        - name: game-shard
          image: kung-fu-chess-game-shard:latest
          imagePullPolicy: Never
          env:
            - name: REDIS_HOST
              value: redis
            - name: RATING_HOST
              value: rating-service
            - name: RATING_PORT
              value: "8002"
            - name: SHARD_PORT
              value: "5556"
            - name: SHARD_HOST
              value: game-shard
            - name: NUM_WORKERS
              value: "2"
          ports:
            - containerPort: 5556
            - containerPort: 5557
---
apiVersion: v1
kind: Service
metadata:
  name: game-shard
spec:
  type: NodePort
  selector:
    app: game-shard
  ports:
    - name: worker-0
      port: 5556
      targetPort: 5556
      nodePort: 30556
    - name: worker-1
      port: 5557
      targetPort: 5557
      nodePort: 30557
