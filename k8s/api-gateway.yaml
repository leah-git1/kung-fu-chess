apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      initContainers:
        - name: wait-for-auth
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z auth-service 8000; do sleep 1; done']
      containers:
        - name: api-gateway
          image: kung-fu-chess-api-gateway:latest
          imagePullPolicy: Never
          env:
            - name: AUTH_HOST
              value: auth-service
            - name: AUTH_PORT
              value: "8000"
            - name: REDIS_HOST
              value: redis
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
