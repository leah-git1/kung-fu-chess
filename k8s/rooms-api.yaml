apiVersion: apps/v1
kind: Deployment
metadata:
  name: rooms-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rooms-api
  template:
    metadata:
      labels:
        app: rooms-api
    spec:
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379; do sleep 1; done']
      containers:
        - name: rooms-api
          image: kfc-backend:latest
          imagePullPolicy: Never
          command:
            - uvicorn
            - services.backend.rooms_api.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8001"
          env:
            - name: REDIS_HOST
              value: redis
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: rooms-api
spec:
  selector:
    app: rooms-api
  ports:
    - port: 8001
      targetPort: 8001
