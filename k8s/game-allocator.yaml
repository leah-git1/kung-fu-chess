apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-allocator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: game-allocator
  template:
    metadata:
      labels:
        app: game-allocator
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis 6379 && nc -z nats 4222 && nc -z rooms-api 8001; do sleep 1; done']
      containers:
        - name: game-allocator
          image: kung-fu-chess-game-allocator:latest
          imagePullPolicy: Never
          env:
            - name: REDIS_HOST
              value: redis
            - name: NATS_URL
              value: nats://nats:4222
            - name: ROOMS_HOST
              value: rooms-api
            - name: ROOMS_PORT
              value: "8001"
            - name: SHARD_PUBLIC_HOST
              value: localhost
            - name: SHARD_PUBLIC_PORT_BASE
              value: "30556"
          ports:
            - containerPort: 8004
---
apiVersion: v1
kind: Service
metadata:
  name: game-allocator
spec:
  selector:
    app: game-allocator
  ports:
    - port: 8004
      targetPort: 8004
