apiVersion: v1
kind: Secret
metadata:
  name: rating-secret
stringData:
  DATABASE_URL: postgresql://kfc:kfc@postgres:5432/kfc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rating-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rating-service
  template:
    metadata:
      labels:
        app: rating-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do sleep 1; done']
      containers:
        - name: rating-service
          image: kfc-backend:latest
          imagePullPolicy: Never
          command:
            - uvicorn
            - services.backend.rating.main:app
            - --host
            - "0.0.0.0"
            - --port
            - "8002"
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rating-secret
                  key: DATABASE_URL
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: rating-service
spec:
  selector:
    app: rating-service
  ports:
    - port: 8002
      targetPort: 8002
