services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    volumes:
      - kfc-db:/app/server/db

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AUTH_HOST=auth-service
      - AUTH_PORT=8000
      - REDIS_HOST=redis
    depends_on:
      - auth-service
      - redis

  rooms-api:
    build:
      context: .
      dockerfile: rooms-api/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  matchmaker-service:
    build:
      context: .
      dockerfile: matchmaker-service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  rating-service:
    build:
      context: .
      dockerfile: rating-service/Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - kfc-db:/app/server/db

  game-shard:
    build:
      context: .
      dockerfile: game-shard/Dockerfile
    ports:
      - "5556:5556"
    volumes:
      - kfc-db:/app/server/db
    environment:
      - REDIS_HOST=redis
      - RATING_HOST=rating-service
      - RATING_PORT=8002
      - SHARD_PORT=5556
    depends_on:
      - redis
      - rating-service

  game-allocator:
    build:
      context: .
      dockerfile: game-allocator/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - REDIS_HOST=redis
      - ROOMS_HOST=rooms-api
      - ROOMS_PORT=8001
      - SHARD_ADDR=kfc-server:5555
    depends_on:
      - redis
      - rooms-api

  kfc-server:
    build: .
    ports:
      - "5555:5555"
    volumes:
      - kfc-db:/app/server/db
    environment:
      - REDIS_HOST=redis
      - AUTH_HOST=auth-service
      - AUTH_PORT=8000
      - ROOMS_HOST=rooms-api
      - ROOMS_PORT=8001
      - RATING_HOST=rating-service
      - RATING_PORT=8002
      - MM_HOST=matchmaker-service
      - MM_PORT=8003
      - ALLOCATOR_HOST=game-allocator
      - ALLOCATOR_PORT=8004
      - SHARD_WS_URL=ws://localhost:5556
    depends_on:
      - redis
      - auth-service
      - api-gateway
      - rooms-api
      - rating-service
      - matchmaker-service
      - game-allocator

volumes:
  kfc-db:
