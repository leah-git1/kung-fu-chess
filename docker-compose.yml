services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kfc
      POSTGRES_PASSWORD: kfc
      POSTGRES_DB: kfc
    ports:
      - "5432:5432"
    volumes:
      - kfc-pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # ── shared backend image (auth, rooms-api, rating) ────────────────────────
  auth-service:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    image: kfc-backend
    command: uvicorn services.backend.auth.main:app --host 0.0.0.0 --port 8000
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://kfc:kfc@postgres:5432/kfc
    depends_on:
      - postgres

  rooms-api:
    image: kfc-backend
    command: uvicorn services.backend.rooms_api.main:app --host 0.0.0.0 --port 8001
    expose:
      - "8001"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - auth-service   # ensures kfc-backend image is built first
      - redis

  rating-service:
    image: kfc-backend
    command: uvicorn services.backend.rating.main:app --host 0.0.0.0 --port 8002
    expose:
      - "8002"
    environment:
      - DATABASE_URL=postgresql://kfc:kfc@postgres:5432/kfc
    depends_on:
      - auth-service   # ensures kfc-backend image is built first
      - postgres

  # ── dedicated images ──────────────────────────────────────────────────────
  matchmaker:
    build:
      context: .
      dockerfile: services/matchmaker/Dockerfile
    expose:
      - "8003"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  game-allocator:
    build:
      context: .
      dockerfile: services/game-allocator/Dockerfile
    expose:
      - "8004"
    environment:
      - REDIS_HOST=redis
      - ROOMS_HOST=rooms-api
      - ROOMS_PORT=8001
      - SHARD_ADDR=game-shard:5556
    depends_on:
      - redis
      - rooms-api
      - game-shard

  game-shard:
    build:
      context: .
      dockerfile: services/game-shard/Dockerfile
    ports:
      - "5556:5556"
    environment:
      - REDIS_HOST=redis
      - RATING_HOST=rating-service
      - RATING_PORT=8002
      - SHARD_PORT=5556
    depends_on:
      - redis
      - rating-service

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - AUTH_HOST=auth-service
      - AUTH_PORT=8000
      - REDIS_HOST=redis
    depends_on:
      - auth-service
      - redis

  ws-gateway:
    build:
      context: .
      dockerfile: services/ws-gateway/Dockerfile
    ports:
      - "5555:5555"
    environment:
      - REDIS_HOST=redis
      - MM_HOST=matchmaker
      - MM_PORT=8003
      - ROOMS_HOST=rooms-api
      - ROOMS_PORT=8001
      - ALLOCATOR_HOST=game-allocator
      - ALLOCATOR_PORT=8004
      - SHARD_WS_URL=ws://localhost:5556
      - WS_PORT=5555
    depends_on:
      - redis
      - api-gateway
      - rooms-api
      - matchmaker
      - game-allocator
      - game-shard

volumes:
  kfc-pg:
